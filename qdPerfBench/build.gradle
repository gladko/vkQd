dependencies {
    // I believe that junit does not impact on perf test results.
    implementation("org.junit.jupiter:junit-jupiter-api:${junitJupiterVersion}")
    implementation "org.junit.jupiter:junit-jupiter-params:${junitJupiterVersion}"
    runtimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitJupiterVersion}")

    // rendering dependencies. Places in test scope to avoid impact on perf test results.
    testImplementation("org.jfree:jfreechart:1.5.3")
    testImplementation("org.jfree:org.jfree.svg:5.0.5")
}

test {
    useJUnitPlatform()
}